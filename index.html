<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Command Center</title><style>:root{--dark:#10281c;--mid:#1f5a3a;--bg:#82ad91;--card:#f7fff9;--border:#d7eadf;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#82ad91;color:#102018}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}aside{background:#10281c;color:white;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:24px}.brand h1{font-size:18px;margin:0}.brand p{margin:4px 0 0;color:#cbe7d6;font-size:12px}.group{font-size:11px;color:#bfe7cd;text-transform:uppercase;letter-spacing:.08em;margin:18px 10px 8px}.nav{width:100%;border:0;border-radius:12px;background:transparent;color:#eef8f1;text-align:left;padding:11px 12px;margin:4px 0;cursor:pointer;font-size:14px}.nav:hover,.nav.active{background:rgba(255,255,255,.16)}main{padding:28px;background:linear-gradient(135deg,#9fc8ad,#74a985);min-height:100vh}.top{display:flex;justify-content:space-between;gap:16px}.top h2{font-size:32px;color:#10281c;margin:0}.pill{background:#10281c;color:white;border-radius:999px;padding:10px 14px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:24px 0}.card,.item,.step{background:white;border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 12px 26px rgba(18,53,36,.1)}.label{font-size:12px;color:#607267}.value{font-size:24px;font-weight:800;color:#10281c;margin:7px 0}.red{color:var(--red)}.hint{font-size:12px;color:#607267}.work{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{background:linear-gradient(135deg,#07110c,#145033);padding:20px;border-radius:24px;color:#eef8f1}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.ph h3{margin:0;color:#f3fff7;font-size:22px}.badge{background:#eef8f1;border-radius:999px;padding:7px 10px;color:#07110c;font-weight:700;font-size:12px}.item,.step{color:#102018;margin-bottom:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta div{background:#f7fff9;border:1px solid var(--border);border-radius:12px;padding:10px}.meta strong,.step strong{display:block;color:#07110c}.btn{background:#1f5a3a;color:white;border:0;border-radius:999px;padding:9px 12px;font-weight:700;cursor:pointer}.warn{background:#fff6db;border:1px solid #f0d98a;border-radius:13px;padding:12px;margin-top:12px}.danger{background:#ffe8e8;border:1px solid #ffb6b6;border-radius:13px;padding:12px;color:#4a1111}@media(max-width:1000px){.app{grid-template-columns:1fr}aside{height:auto;position:relative}.cards{grid-template-columns:repeat(2,1fr)}.work{grid-template-columns:1fr}}@media(max-width:560px){.cards,.meta{grid-template-columns:1fr}main{padding:16px}}</style></head><body><div class="app"><aside><div class="brand"><div class="logo">🧭</div><div><h1>Command Center</h1><p>Hosted dashboard build</p></div></div><div class="group">Daily Command</div><button class="nav" data-section="overview">🧭 Overview</button><button class="nav" data-section="daily">Daily Summary</button><button class="nav" data-section="gate">🚦 Gate</button><button class="nav" data-section="exceptions">🚨 Exceptions</button><button class="nav" data-section="watchlist">👀 Watchlist</button><button class="nav" data-section="ready">✅ Ready Trades</button><button class="nav" data-section="trades">📈 Trades / Reconciliation</button><button class="nav" data-section="alerts">🔔 Alerts / Parsers</button><button class="nav" data-section="testing">🧪 Testing Mode</button><button class="nav" data-section="foundation">🏛️ Foundation</button></aside><main><div class="top"><div><h2 id="title">Loading</h2><p id="subtitle"></p></div><div class="pill">Manual-submit only • No live auto-trading</div></div><section class="cards"><div class="card"><div class="label">Gate</div><div class="value red">Needs check</div><div class="hint">Check VectorVest first</div></div><div class="card"><div class="label">Exceptions</div><div class="value">4</div><div class="hint">Controlled blockers</div></div><div class="card"><div class="label">Ready</div><div class="value">0</div><div class="hint">No ready trades</div></div><div class="card"><div class="label">Open</div><div class="value">2</div><div class="hint">HOOD, AAPL</div></div><div class="card"><div class="label">Alerts</div><div class="value">2</div><div class="hint">Examples needed</div></div><div class="card"><div class="label">Mode</div><div class="value">Test</div><div class="hint">Not go-live</div></div></section><section class="work"><div class="panel"><div class="ph"><h3 id="panelTitle"></h3><span class="badge" id="badge"></span></div><div id="content"></div></div><div class="panel"><div class="ph"><h3>Next Actions</h3><span class="badge">Safe only</span></div><div id="actions"></div></div></section></main></div><script>const sections={overview:['Overview','Connected snapshot and daily control flow.','Daily Workflow','Overview','<div class="item"><h4>System Snapshot</h4><div class="meta"><div><strong>Gate</strong>Check today first</div><div><strong>Exceptions</strong>Review blockers</div><div><strong>Ready</strong>0</div><div><strong>Open</strong>Broker confirmed only</div></div></div>',['Review Gate','Check Open Trades','Review Alerts']],daily:['Daily Summary','Follow this order each morning.','Daily Workflow','Daily','<div class="step"><strong>1. Gate</strong>Check market permission first</div><div class="step"><strong>2. Exceptions</strong>Review blockers</div><div class="step"><strong>3. Watchlist</strong>Score and classify</div><div class="step"><strong>4. Ready Ticket</strong>Complete before manual submit</div><div class="step"><strong>5. Journal</strong>Review after close</div>',['Open First Testing Checklist','Open Parser Inbox','Open Remaining Inputs']],gate:['Gate','Latest gate state.','Gate Panel','Manual check','<div class="item"><h4>Gate</h4><div class="danger">Check VectorVest MTI, BSR Light, and Color Guard before any new trade.</div></div>',['Open normal gate','Enter today real gate']],exceptions:['Exceptions','Current controlled blockers.','Exception Panel','Review','<div class="item"><h4>Exceptions</h4><div class="meta"><div><strong>NU</strong>Re-check only after gate</div><div><strong>ZM</strong>Risk too high for $6k account</div><div><strong>HPE</strong>Parked until entry improves</div><div><strong>Parsers</strong>Need controlled examples</div></div></div>',['Open Exception Queue','Review blockers']],watchlist:['Watchlist','Candidates and source intake.','Watchlist Panel','Needs review','<div class="item"><h4>Watchlist</h4><p>Ideas come from OptionsPlay 360, Options Alert, Stock Alarm, Pro Ticker, TradingView, OptionsPro, TradeStation, and manual research. Signals do not bypass gate, scoring, risk, ticket match, or manual approval.</p></div>',['Open Watchlist','Score missing rows']],ready:['Ready Trades','Complete tickets only.','Ready Panel','0 ready','<div class="item"><h4>Ready Trades</h4><p>No trade should be submitted unless gate allows, ticket matches exactly, risk fits, and Bernard manually approves.</p><div class="warn">Bernard manually submits every order.</div></div>',['Open Ready Checklist']],trades:['Trades / Reconciliation','Broker truth controls status.','Trades Panel','Broker truth','<div class="item"><h4>Trades</h4><div class="meta"><div><strong>Submitted/Pending</strong>Not Open</div><div><strong>Filled/Executed</strong>May become Open after match</div><div><strong>Rejected</strong>Exception</div><div><strong>Closed</strong>Journal required</div></div></div>',['Review open positions','Match confirmation']],alerts:['Alerts / Parsers','Real examples needed.','Alerts Panel','Examples','<div class="item"><h4>Alerts</h4><p>Capture TradingView, Pro Ticker, Options Alert, Stock Alarm, broker confirmation, OptionsPlay 360, and OptionsPro examples before trusting automation.</p></div>',['Capture alert','Review parser inbox']],testing:['Testing Mode','System is build/test, not go-live.','Testing','Controlled','<div class="item"><h4>Testing</h4><p>Test navigation and controls. No live trades during test-only steps.</p></div>',['Run controlled test','Open Session Log']],foundation:['Foundation','Long-term portfolio area.','Foundation','Separate','<div class="item"><h4>Foundation</h4><p>Foundation tracker is separate from tactical trading. Do not mix them.</p></div>',['Open Foundation Tracker']]};function render(key){const x=sections[key]||sections.overview;document.getElementById('title').textContent=x[0];document.getElementById('subtitle').textContent=x[1];document.getElementById('panelTitle').textContent=x[2];document.getElementById('badge').textContent=x[3];document.getElementById('content').innerHTML=x[4];document.getElementById('actions').innerHTML=x[5].map(v=>'<div class="step"><div><strong>'+v+'</strong><small> safe dashboard action</small></div><button class="btn">Safe Action</button></div>').join('');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.section===key));document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>alert('Safe dashboard action only. No broker order is submitted.'));window.scrollTo(0,0)}document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>render(b.dataset.section));render('overview')});</script></body></html>
